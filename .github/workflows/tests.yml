name: Offline regression tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.suite }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
            suite: full
          - os: ubuntu-latest
            python: '3.12'
            suite: full
          - os: ubuntu-latest
            python: '3.13'
            suite: full
          - os: macos-latest
            python: '3.12'
            suite: full
          - os: windows-latest
            python: '3.12'
            suite: new-runtime-and-protocol
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned runtime and test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Complete offline suite
        if: matrix.suite == 'full'
        run: python -m unittest discover -s tests -v
      - name: Windows runtime and protocol coverage
        if: matrix.suite != 'full'
        run: |
          python -m unittest discover -s tests -p test_runtime.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_stability.py -v
          exit $LASTEXITCODE
      - name: Dashboard script syntax and safe live rendering
        run: node tests/check_dashboard.js
