name: Stability baseline

on:
  push:
    branches: [fix/stability-20260921]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Existing offline regressions
        run: python tests/test_regressions.py
      - name: Package tracked source and pinned runtime wheels
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/stability-export/wheels"
          git archive --format=zip HEAD -o "$RUNNER_TEMP/stability-export/devinx-source.zip"
          python -m pip download --only-binary=:all: --no-deps -r requirements.txt -d "$RUNNER_TEMP/stability-export/wheels"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: stability-source
          path: ${{ runner.temp }}/stability-export/
          retention-days: 3
