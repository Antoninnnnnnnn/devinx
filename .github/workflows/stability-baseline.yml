name: Apply validated stability changes

on:
  push:
    branches: [fix/stability-20260921]
    paths: [_stability_edits.json, .github/workflows/stability-baseline.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'ci: apply validated stability changes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Apply exact edits and verify every candidate file
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          allowed = {'README.md', 'devinx.py', 'launcher.py', 'tests/test_regressions.py', 'tools/dashboard.html'}
          changes = json.loads(Path('_stability_edits.json').read_text(encoding='utf-8'))
          assert {change['path'] for change in changes} == allowed
          assert len(changes) == len(allowed)
          pending = []
          for change in changes:
              path = Path(change['path'])
              raw = path.read_bytes()
              assert hashlib.sha256(raw).hexdigest() == change['before'], ('base changed', str(path))
              lines = raw.decode('utf-8').splitlines(keepends=True)
              boundary = len(lines)
              for start, end, replacement in reversed(change['edits']):
                  assert 0 <= start <= end <= boundary, ('invalid edit', str(path), start, end)
                  boundary = start
                  lines[start:end] = replacement.splitlines(keepends=True)
              data = ''.join(lines).encode('utf-8')
              assert hashlib.sha256(data).hexdigest() == change['after'], ('candidate mismatch', str(path), hashlib.sha256(data).hexdigest())
              pending.append((path, data))
          hashes = {
              'runtime_support.py': 'b67b24f8eb07528804c98146f495efe695e61b699453c7d93a8b800bc0e9debc',
              'diagnostics.py': '92b43de2c06c8620657f29fef9c9c9f87c9e60030f03ae692a5b30a6dda9affc',
              'requirements-test.txt': '596bb030b2bebf4d2d731749591a12bc0d80164d75591e4387bcd874c3d0d49f',
              'tests/test_stability.py': '541b80d71a58bdb05a51188bf555c5b3180896f2b14ed08196a676408adb1a66',
              'tests/test_runtime.py': '27c1b3d2716a5409c18b8b089ad10e7b462a0d15442f5cbdffe789d380b44a29',
              'tests/check_dashboard.js': 'fb7e2046aa32d33366d9f2d7862cc15b03041eef542dc708ed95befe03ee408f',
              'docs/stability.md': '8df8606745d1e91ff20265f475b88e32883d69f8485b3fd612d91b42ca99fa48',
          }
          for filename, expected in hashes.items():
              actual = hashlib.sha256(Path(filename).read_bytes()).hexdigest()
              assert actual == expected, ('new file mismatch', filename, actual)
          for path, data in pending:
              path.write_bytes(data)
              print('Validated exact candidate:', path)
          PY
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Test before committing
        run: |
          python -m unittest discover -s tests -v
          node tests/check_dashboard.js
          git diff --check
      - name: Commit and push the tested feature branch only
        run: |
          git add README.md devinx.py launcher.py tests/test_regressions.py tools/dashboard.html
          git rm -- _stability_edits.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: harden streaming, compaction and service lifecycle'
          git push origin HEAD:refs/heads/fix/stability-20260921
