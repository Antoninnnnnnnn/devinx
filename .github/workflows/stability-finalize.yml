name: Finalize outcome accounting
on:
  push:
    branches: [fix/stability-20260921]
    paths: [.github/workflows/stability-finalize.yml]
permissions:
  contents: write
jobs:
  apply:
    if: >-
      github.event.head_commit.message == 'test: finalize SWE outcome accounting'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply and verify exact final candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('devinx.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '95c924f314f0e4f7458da02454df0946859628a9f8c029ca1f397c61a8a525d9'
          s = p.read_text()
          a = '''            print(f"route=swe model={body.get('model')} status={type(e).__name__}: {e}",
                            flush=True)'''
          b = '''            print(f"swe handler error: {type(e).__name__}", flush=True)'''
          assert s.count(a) == 1
          s = s.replace(a, b)
          a = '''            print(f"route=swe-responses model={body.get('model')} "
                            f"status={outcome}", flush=True)'''
          b = '''            print(f"swe responses handler error: {outcome}", flush=True)'''
          assert s.count(a) == 1
          s = s.replace(a, b)
          a = '''            print(f"route=swe-responses model={resolve_model(translated)} "
                            f"status={outcome} in {time.monotonic() - started:.1f}s",'''
          b = '''            print(f"route=swe model={resolve_model(translated)} "
                            f"status={outcome} in {time.monotonic() - started:.1f}s "
                            f"protocol=responses",'''
          assert s.count(a) == 1
          s = s.replace(a, b)
          assert hashlib.sha256(s.encode()).hexdigest() == '4cd879f805b520af2ffd743da1b8e2cb54f80eb6ddc6a7d98d8c9d454aa5a548'
          p.write_text(s)
          p = Path('tests/test_stability.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '541b80d71a58bdb05a51188bf555c5b3180896f2b14ed08196a676408adb1a66'
          s = p.read_text()
          extra = '''class OutcomeLoggingTests(unittest.TestCase):
              def _capture(self, responses, fail=False):
                  handler = object.__new__(devinx.Handler)
                  handler.wfile = io.BytesIO()
                  def execute(*args, outcome=None):
                      if fail:
                          raise ValueError('unexpected test error')
                      outcome['status'] = 'stream_error'
                      return None, None
                  log = io.StringIO()
                  with mock.patch.object(devinx, 'run_swe', side_effect=execute), \\
                       contextlib.redirect_stdout(log):
                      method = handler.serve_swe_responses if responses else handler.serve_swe
                      method({'model': 'swe-2-max', 'stream': True})
                  return log.getvalue()
          
              def test_both_wires_count_as_swe_client_errors_not_relay_latency(self):
                  from tools import log_stats
                  for responses in (False, True):
                      with self.subTest(responses=responses), tempfile.TemporaryDirectory() as directory:
                          path = Path(directory) / 'test.log'
                          path.write_text(self._capture(responses), encoding='utf-8')
                          stats = log_stats.collect(str(path))
                          self.assertEqual(stats['client_status'], {'stream_error': 1})
                          self.assertEqual(stats['relay_latency'], [])
          
              def test_unexpected_failure_is_counted_once_on_each_wire(self):
                  from tools import log_stats
                  for responses in (False, True):
                      with self.subTest(responses=responses), tempfile.TemporaryDirectory() as directory:
                          path = Path(directory) / 'test.log'
                          path.write_text(self._capture(responses, fail=True), encoding='utf-8')
                          stats = log_stats.collect(str(path))
                          self.assertEqual(stats['client_status'], {'ValueError': 1})
                          self.assertEqual(stats['relay_latency'], [])
          
          
          '''
          a = "if __name__ == '__main__':\n    unittest.main(verbosity=2)\n"
          assert s.count(a) == 1
          s = s.replace(a, extra + a)
          assert hashlib.sha256(s.encode()).hexdigest() == '4c826895822c18bf8a5a5de15fc74f93a642873a2f921e73fec14e33a3efecf4'
          p.write_text(s)
          PY
      - name: Validate before commit
        run: |
          python -m pip install -r requirements-test.txt
          python -m unittest discover -s tests -v
          node tests/check_dashboard.js
          git diff --check
      - name: Commit and push feature branch
        run: |
          git add devinx.py tests/test_stability.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: count SWE outcomes once across both client protocols'
          git push origin HEAD:refs/heads/fix/stability-20260921
